<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'"><title>T3 Pet menu</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="menu.css"></head><body data-closed>
